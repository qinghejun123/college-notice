一、考试提醒
　　本周末进行计算机等级考试。请考生携带准考证与有效身份证件，按准考证载明的时间与考场准时入场，开考前建议提前 30 分钟到场；严禁携带手机等电子设备进入考场，全程遵守考场纪律。信息有误须在开考前联系教务办公室更正。

　　各系部：本周四号楼承接计算机等级考试，本周末封楼。封楼期间四号楼不对外开放，不安排教学活动、自习及其他非考试用途。原定于四号楼开展的课程由各系部调整至其他教学楼或改为线上，调整方案须于封楼前报教务办公室备案并通知到学生。
